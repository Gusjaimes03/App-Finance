name: GusBudget iOS

# Compila la app en un Mac de GitHub y deja un .ipa sin firmar como artefacto.
# Sirve para dos cosas: comprobar que todo compila y poder instalarla con
# AltStore/Sideloadly sin tener un Mac a mano.

on:
  push:
    branches: ["**"]
    paths:
      - "ios-gusbudget/**"
      - ".github/workflows/gusbudget-ios.yml"
  workflow_dispatch:

jobs:
  construir:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Versión de Xcode
        run: xcodebuild -version

      - name: Compilar sin firma
        working-directory: ios-gusbudget
        run: |
          set -o pipefail
          xcodebuild \
            -project GusBudget.xcodeproj \
            -scheme GusBudget \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Empaquetar el .ipa
        working-directory: ios-gusbudget
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GusBudget.app Payload/
          zip -qry GusBudget-sin-firmar.ipa Payload
          ls -lh GusBudget-sin-firmar.ipa

      - name: Subir el .ipa
        uses: actions/upload-artifact@v4
        with:
          name: GusBudget-sin-firmar
          path: ios-gusbudget/GusBudget-sin-firmar.ipa
          retention-days: 30
