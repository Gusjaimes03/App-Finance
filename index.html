<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d7bd8">
  <meta name="description" content="Control de alquiler de carros para niños: cronómetro por carro, pagos y contabilidad diaria.">
  <title>Carritos Kids</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="40" height="40">
      <div>
        <h1 id="bizName">Carritos Kids</h1>
        <p id="clock" class="clock"></p>
      </div>
    </div>
    <div class="topbar-total" id="headerTotals" aria-live="polite"></div>
  </header>

  <nav class="tabs" aria-label="Secciones">
    <button type="button" data-view="pista" aria-current="page">Pista</button>
    <button type="button" data-view="registro">Registro</button>
    <button type="button" data-view="contabilidad">Contabilidad</button>
    <button type="button" data-view="ajustes">Ajustes</button>
  </nav>

  <main id="main" tabindex="-1"></main>

  <dialog id="modal" aria-labelledby="modalTitle">
    <form id="modalForm" method="dialog" novalidate></form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript>Esta aplicación necesita JavaScript activado.</noscript>

  <script src="js/core.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
